<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9a7a38" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#9a7a38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7a38" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9a7a38" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9a7a38" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f7f3ed"/>

  <!-- Subtle noise texture overlay -->
  <rect width="1200" height="630" fill="url(#glow)" opacity="0.6"/>

  <!-- Glow circle center -->
  <ellipse cx="600" cy="315" rx="340" ry="340" fill="url(#glow)"/>

  <!-- Corner decorations -->
  <rect x="60" y="60" width="40" height="1" fill="#9a7a38" opacity="0.3"/>
  <rect x="60" y="60" width="1" height="40" fill="#9a7a38" opacity="0.3"/>
  <rect x="1100" y="60" width="40" height="1" fill="#9a7a38" opacity="0.3"/>
  <rect x="1139" y="60" width="1" height="40" fill="#9a7a38" opacity="0.3"/>
  <rect x="60" y="569" width="40" height="1" fill="#9a7a38" opacity="0.3"/>
  <rect x="60" y="530" width="1" height="40" fill="#9a7a38" opacity="0.3"/>
  <rect x="1100" y="569" width="40" height="1" fill="#9a7a38" opacity="0.3"/>
  <rect x="1139" y="530" width="1" height="40" fill="#9a7a38" opacity="0.3"/>

  <!-- Logo symbol (enso) centered -->
  <g transform="translate(600, 230)">
    <!-- outer ring -->
    <circle cx="0" cy="0" r="72" stroke="#9a7a38" stroke-width="1.2" fill="none" opacity="0.4"/>
    <!-- enso brushstroke -->
    <path d="M0 -67 A67 67 0 1 1 -41.4 55.3" stroke="#9a7a38" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- center dot -->
    <circle cx="0" cy="0" r="6" fill="#9a7a38" opacity="0.35"/>
    <!-- inner ring -->
    <circle cx="0" cy="0" r="22" stroke="#9a7a38" stroke-width="1" fill="none" opacity="0.2"/>
  </g>

  <!-- Divider line -->
  <rect x="200" y="340" width="800" height="1" fill="url(#divLine)"/>

  <!-- 심리상담연구소 label -->
  <text x="600" y="388" font-family="'Noto Serif KR', serif" font-weight="300" font-size="16" fill="#4a4035" text-anchor="middle" letter-spacing="6" opacity="0.6">심리상담연구소</text>

  <!-- Main title 내면의 지도 -->
  <text x="600" y="460" font-family="'Noto Serif KR', serif" font-weight="900" font-size="82" fill="#1a1612" text-anchor="middle" letter-spacing="-4">내면의 지도</text>

  <!-- English subtitle -->
  <text x="600" y="506" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-weight="300" font-size="22" fill="#9a7a38" text-anchor="middle" letter-spacing="8">The Inner Map</text>

  <!-- Bottom label -->
  <text x="600" y="570" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" fill="#9a7a38" text-anchor="middle" letter-spacing="4" opacity="0.6">PSYCHOLOGICAL COUNSELING INSTITUTE</text>
</svg>
